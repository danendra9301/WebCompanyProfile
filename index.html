<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <style>
       * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'sagoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body{
            line-height: 1,6;
            color: #333;
            scroll-behavior: smooth;
        }
        header{
            background: #fff;
            padding: 1rem 5%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: fixed;
            width: 100%;
            top: 0;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
            z-index: 1000;
        }
        .logo{
            font-size: 1.5rem;
            font-weight: bold;
            color: #333;
        }
        nav a{
            color: #333;
            text-decoration: none;
            margin-left: 1.5rem;
            font-size: 1rem;
            transition: color 0.3s ease;
        }
        nav a:hover{
            color: #2563eb;
        }
        .hero{
            background: url('https://source.unsplash.com/1600x900/?technology') no-repeat center center/cover;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            color: #fff;
            text-align: center;
            padding: 0 1rem;
        }
        .hero{
            height: 100vh;
            background: linear-gradient(rgb(0,0,0,0,6), rgba(0,0,0,0,6)),
            url('https://images.unsplash.com/photo-1497215728101-856f4ea42174?auto=format&fit=crop&w=1350&q=80');
            background-size: cover;
            background-position: center;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
        }
    </style>
</body>
</html>
